[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-narrative"
version = "0.1.0"
description = "Auditable screenplay knowledge-graph and narrative hierarchy builder"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "json-repair>=0.59.5",
  "jieba>=0.42.1",
  "numpy>=1.26",
  "openai>=1.40.0",
  "PyYAML>=6.0",
  "rank-bm25>=0.2.2",
  "tokenizers>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stage-build-narrative-graph = "stage_narrative.cli:main"
stage-build-character-temporal-assets = "stage_narrative.temporal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
