id: task3_rubric_construction
category: benchmark_construction
name: Task 3 rubric construction
description: Build a compact response-judge rubric for one checkpoint role-playing prompt.
task_variables:
  - name: character
    required: true
  - name: current_user_turn
    required: true
  - name: actor_context_pack
    required: true
  - name: rubric_candidates
    required: true
  - name: future_candidates
    required: true
static_variables: []
template: |-
  Build an evaluator rubric for "{character}" answering the single-turn prompt at the current checkpoint.
  <current_user_turn>{current_user_turn}</current_user_turn>
  <actor_context_pack>{actor_context_pack}</actor_context_pack>
  <rubric_candidates>{rubric_candidates}</rubric_candidates>
  <future_candidates>{future_candidates}</future_candidates>

  Describe acceptable current stances, relevant memories, clear contradictions, knowledge boundaries, and style requirements rather
  than writing one reference response. Do not treat expected stances or gold summaries as actor-visible text. Select only future
  negatives relevant to this prompt from the supplied F labels. Remove irrelevant, duplicate, or unsupported candidates.
  If future_candidates is empty, salient_future_negatives must be an empty list.

  Return only JSON:
  {{
    "expected_stances": ["..."],
    "acceptable_variations": ["..."],
    "required_or_relevant_memories": ["..."],
    "contradictions": ["..."],
    "unknown_at_checkpoint": ["..."],
    "salient_future_negatives": [{{"claim": "...", "source_future_local_ids": ["F1"]}}],
    "style_requirements": ["..."]
  }}
