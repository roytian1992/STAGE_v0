id: evaluation_v1_task1_sequence_judge
category: evaluation_v1
name: Task 1 adjacent sequence judge v1
description: Judge consistency across two adjacent checkpoint predictions.
task_variables:
  - {name: focal_character, required: true}
  - {name: earlier_checkpoint, required: true}
  - {name: later_checkpoint, required: true}
  - {name: earlier_prediction, required: true}
  - {name: later_prediction, required: true}
  - {name: interval_evidence, required: true}
static_variables: []
template: |-
  Evaluate adjacent rolling predictions for {focal_character}.
  <earlier_checkpoint>{earlier_checkpoint}</earlier_checkpoint>
  <later_checkpoint>{later_checkpoint}</later_checkpoint>
  <earlier_prediction>{earlier_prediction}</earlier_prediction>
  <later_prediction>{later_prediction}</later_prediction>
  <interval_evidence>{interval_evidence}</interval_evidence>

  state_carry_forward is true when earlier important states either persist into the later state or are explicitly superseded by interval evidence/developments. development_to_state_coherent is true when later developments have a compatible before/after direction and their consequences agree with the later state. contradiction_present covers unexplained incompatible states. premature_or_future_information covers information unavailable by the relevant checkpoint. Return only JSON:
  {{"state_carry_forward":true,"development_to_state_coherent":true,"contradiction_present":false,"premature_or_future_information":false,"local_evidence_labels":[],"brief_rationale":"short audit rationale"}}
