id: task2_answer_only_judge
category: evaluation
name: Task 2 answer-only filter fallback judge
description: Judge answer correctness when the provider refuses screenplay evidence text.
task_variables:
  - {name: question, required: true}
  - {name: reference_answer, required: true}
  - {name: reference_evidence_or_reason, required: true}
  - {name: candidate_answer, required: true}
static_variables: []
template: |-
  Evaluate only the correctness of one answer to an already-written fictional screenplay question. The provider refused the retrieved screenplay passages, so citation quality is intentionally not evaluated.
  <question>{question}</question>
  <reference_answer>{reference_answer}</reference_answer>
  <reference_evidence_or_reason>{reference_evidence_or_reason}</reference_evidence_or_reason>
  <candidate_answer>{candidate_answer}</candidate_answer>

  Set answer_correct=true only when the candidate conveys the reference answer's required facts without a material contradiction. Accept equivalent wording and concise answers; reject missing required facts, wrong entities/events/relations, unsupported guesses, or an insufficiency response when the reference establishes the answer. Return a short audit rationale without hidden reasoning.

  Return only JSON with exactly these fields and the fixed citation value:
  {{"answer_correct":true,"citation_quality":"not_evaluated_provider_filter","brief_rationale":"..."}}
