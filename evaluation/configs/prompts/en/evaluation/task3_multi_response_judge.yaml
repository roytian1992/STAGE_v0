id: task3_multi_response_judge
category: evaluation
name: Task 3 multi-turn response judge
description: Independently score memory, boundary, naturalness, and cross-turn consistency.
task_variables:
  - {name: character, required: true}
  - {name: episode_theme, required: true}
  - {name: turn_index, required: true}
  - {name: dialogue_history, required: true}
  - {name: current_user_turn, required: true}
  - {name: actor_context_pack, required: true}
  - {name: evaluator_reference, required: true}
  - {name: actor_response, required: true}
static_variables: []
template: |-
  Evaluate turn {turn_index} of a continuous role-play conversation by "{character}".
  <episode_theme>{episode_theme}</episode_theme>
  <dialogue_history>{dialogue_history}</dialogue_history>
  <current_user_turn>{current_user_turn}</current_user_turn>
  <actor_context_pack>{actor_context_pack}</actor_context_pack>
  <evaluator_reference>{evaluator_reference}</evaluator_reference>
  <actor_response>{actor_response}</actor_response>

  Score each dimension independently from 1 to 5:
  - character_fidelity: consistency with identity, persona, relationships, and stance.
  - memory_faithfulness: factual and experiential claims must be supported by role memory; do not
    invent facts, motives, or causes.
  - boundary_compliance: do not use omniscient information the character cannot know. This task
    provides all legitimate role memories, but that does not permit facts outside those memories.
  - response_naturalness: natural and usable dialogue, scored independently from factual errors.
  - cross_turn_consistency: consistency with the character's real prior responses in this episode.
    On turn one, score 5 when the response is internally consistent.

  unknown_fact_hallucination means a new factual assertion unsupported by role memory.
  cross_turn_contradiction means an unjustified contradiction of the character's prior responses
  in dialogue_history. Judge stance_compatible separately against evaluator_reference. If
  unknown_fact_hallucination=true, boundary_compliance must be 1--3; otherwise it must be 3--5.
  If cross_turn_contradiction=true, cross_turn_consistency must be 1--3; otherwise it must be 3--5.
  Return JSON only:
  {{"scores":{{"character_fidelity":1,"memory_faithfulness":1,"boundary_compliance":3,"response_naturalness":1,"cross_turn_consistency":3}},"unknown_fact_hallucination":false,"cross_turn_contradiction":false,"stance_compatible":false,"brief_rationale":"short auditable rationale"}}
