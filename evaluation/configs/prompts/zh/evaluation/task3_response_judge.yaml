id: task3_response_judge_zh
category: evaluation
name: Task 3 回答 judge
description: 独立评定四个有逐档锚点的维度和边界标记。
task_variables:
  - {name: character, required: true}
  - {name: checkpoint, required: true}
  - {name: current_user_turn, required: true}
  - {name: actor_context_pack, required: true}
  - {name: gold_rubric, required: true}
  - {name: actor_response, required: true}
  - {name: allowed_evidence_ids, required: true}
static_variables: []
template: |-
  评测“{character}”在冻结 checkpoint 的一次 single-turn 回答。
  <checkpoint>{checkpoint}</checkpoint><current_user_turn>{current_user_turn}</current_user_turn>
  <actor_context_pack>{actor_context_pack}</actor_context_pack><gold_rubric>{gold_rubric}</gold_rubric>
  <actor_response>{actor_response}</actor_response>
  <allowed_evidence_ids>{allowed_evidence_ids}</allowed_evidence_ids>

  各维度独立打分。
  Character Fidelity：5 身份、人格、关系和当前立场完全一致；4 明显符合但有轻微不足；3 可辨认但明显泛化或部分不一致；2 重大不兼容；1 身份或阶段错误，或根本未扮演角色。
  Memory Faithfulness：5 所有事实和经历均有当前可见依据，或没有无依据陈述；4 轻微不精确；3 有实质歧义或夸大；2 有重大虚构或使用不可见记忆；1 核心内容虚构或冲突。简短但有依据的回答可得 5。
  Boundary Compliance：5 无未来或未知信息且正确处理不确定性；4 只有微弱暗示；3 边界含糊或有限无依据暗示；2 有明确但非核心泄露；1 核心依赖未来或未知信息。两项 violation 均为 false 时不得因风格或立场扣此分。
  Response Naturalness 只评价对话形式，与事实和立场正确性独立：5 流畅自然且构成合理言语行为；4 自然但略生硬或冗长；3 能理解但离题、像摘要或明显别扭；2 大量说明性、碎片化或元话语；1 不是可用对话话语。不得仅因事实、立场、记忆或边界错误降低 Naturalness。
  future_leakage 指把 checkpoint 后真实发生的事件或揭示提前说出。unknown_fact_hallucination 指角色当前可见证据不支持的任何新事实断言，包括完全虚构的解释、只有旁观者或其他角色知道的事实以及无依据归因。stance_compatible 与事实依据分开。双向一致性硬约束：两个 violation flag 都为 false 时 Boundary 必须为 3--5；任一 flag 为 true 时 Boundary 必须为 1--3。evidence_local_ids 只能逐字使用 allowed_evidence_ids 中的字符串；没有合法支持标签时返回 []。

  对比校准：只用错指代但没有新增无依据事实时，应降低 Fidelity 或 Memory，不必降低 Boundary 或 Naturalness；流畅但无依据的事实解释必须 unknown_fact_hallucination=true 并降低 Memory 和 Boundary，但 Naturalness 可保持高分；简短但完全有依据的拒答可以获得 Memory=5 和 Boundary=5。返回前检查 boundary 分数与 flag 的硬约束，只返回 JSON：
  {{"scores":{{"character_fidelity":1,"memory_faithfulness":1,"boundary_compliance":5,"response_naturalness":5}},"future_leakage":false,"unknown_fact_hallucination":false,"stance_compatible":false,"evidence_local_ids":[],"brief_rationale":"简短可审计说明"}}
