id: task1_evidence_judge_zh
category: evaluation
name: Task 1 checkpoint evidence judge zh
description: 对有界预测批次判断支持、引用、时机和发展连贯性。
task_variables:
  - {name: checkpoint, required: true}
  - {name: prediction_batch, required: true}
  - {name: active_gold_rubric, required: true}
  - {name: future_negatives, required: true}
  - {name: evidence_scenes, required: true}
  - {name: allowed_prediction_ids, required: true}
static_variables: []
template: |-
  判断角色 checkpoint 中一个有界预测批次。
  <checkpoint>{checkpoint}</checkpoint><prediction_batch>{prediction_batch}</prediction_batch>
  <active_gold_rubric>{active_gold_rubric}</active_gold_rubric>
  <future_negatives>{future_negatives}</future_negatives>
  <evidence_scenes>{evidence_scenes}</evidence_scenes>
  <allowed_prediction_ids>{allowed_prediction_ids}</allowed_prediction_ids>

  prediction_checks 必须逐一覆盖本批次所有允许的 P ID。support 判断预测是否被给定的已审核 gold obligation 或剧本片段支持；evidence_grounded 判断预测自己引用的 scene 是否真正支持 claim。checkpoint_valid 只有在 claim 此时已经成立且属于所声明的池时为 true：状态在 checkpoint 末仍成立，发展则是从上一正式 checkpoint 至今已生效的前后变化。salient 只有在 claim 对刻画焦点角色轨迹确有价值时为 true；普通动作、短暂情绪、泛化场景摘要和重复细节均不显著。状态预测的 transition_coherent 固定为 true；development 只有表达连贯且已生效的重要前后变化时才为 true。future_leak_prediction_ids 标记使用当前时点不可用信息的 claim；premature_update_prediction_ids 标记在生效前提前断言的真实发展。只能使用本批次 P ID。只返回 JSON：
  {{"prediction_checks":[{{"prediction_local_id":"P1","support":"supported|partial|unsupported","transition_coherent":true,"evidence_grounded":true,"checkpoint_valid":true,"salient":true}}],"future_leak_prediction_ids":[],"premature_update_prediction_ids":[]}}
